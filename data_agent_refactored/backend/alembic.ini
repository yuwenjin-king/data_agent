[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# migrations/env.py overrides this via settings.DATABASE_URL at runtime.
# This fallback is only used when that override is not active.
sqlalchemy.url = sqlite:///./data_agent_alembic.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
