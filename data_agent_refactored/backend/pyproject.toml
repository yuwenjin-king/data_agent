[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "migrations"]

[tool.ruff.lint]
# Default pyflakes/pycodify error classes plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E712",  # == True / == False — SQLAlchemy requires == over `is` for column filters
    "E711",  # == None — same SQLAlchemy column-comparison reason
]

[tool.ruff.lint.per-file-ignores]
# Side-effect imports (module registration) are intentional in __init__ / conftest.
"__init__.py" = ["F401"]
"tests/**" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:pytest_asyncio.plugin",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_implicit_optional = false  # FastAPI idiom: query params like `param: str = None`
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "\\.venv/"]
# Models use legacy SQLAlchemy Column(...) (not Mapped[...]); without a full
# model migration mypy sees Column[X] instead of X, which floods arg-type /
# assignment wherever ORM attributes are read. These two codes are disabled
# app-wide; re-enable after migrating models to Mapped[...].
disable_error_code = ["arg-type", "assignment"]
